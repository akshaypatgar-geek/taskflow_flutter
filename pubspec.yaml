name: taskflowapp
description: "A task management app with offline sync, allowing users to create, update, and manage task names, priorities, and statuses"
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_secure_storage: ^10.0.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  dio: ^5.9.2
  go_router: ^17.1.0
  email_validator: ^3.0.0
  dartz: ^0.10.1
  intl: ^0.20.2
  socket_io_client: ^3.1.4
  jwt_decoder: ^2.0.1
  equatable: ^2.0.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  internet_connection_checker_plus: ^2.9.1+2
  uuid: ^4.5.3
  meta: ^1.17.0
  flutter_dotenv: ^6.0.0
  get_it: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  freezed: ^3.2.5
  build_runner: ^2.11.1
  json_serializable: ^6.12.0
  hive_ce_generator: ^1.1.1
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - .env
  
